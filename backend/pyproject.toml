[project]
name = 'nocmind-backend'
version = '1.0.0'
requires-python = '>=3.11'
dependencies = [
  'fastapi==0.141.1',
  'uvicorn[standard]>=0.30,<1.0',
  'pydantic>=2.9,<3',
  'sqlalchemy>=2.0,<3',
  'alembic>=1.14,<2',
  'scikit-learn>=1.5,<2',
  'numpy>=2,<3',
  'httpx>=0.27,<1',
  'prometheus-client>=0.21,<1',
  'PyJWT>=2.10,<3',
  'langgraph==1.2.12',
  'langchain>=1,<2',
  'sentence-transformers>=5,<6',
  'psycopg[binary]>=3.2,<4',
  'redis>=6,<7',
  'mlflow-skinny>=3,<4',
  'opentelemetry-api>=1.37,<2',
  'opentelemetry-sdk>=1.37,<2',
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
# B008: FastAPI's Depends() in argument defaults is the framework's documented pattern.
ignore = ["B008", "B904", "B905", "E701", "E702"]
