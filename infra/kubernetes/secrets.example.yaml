# Example only. Do not commit real values; create the secret with kubectl or a secret manager.
apiVersion: v1
kind: Secret
metadata: {name: nocmind-secrets}
type: Opaque
stringData:
  database-url: postgresql+psycopg://nocmind:nocmind@postgres:5432/nocmind
  jwt-secret: <generate: python -c "import secrets; print(secrets.token_urlsafe(48))">
