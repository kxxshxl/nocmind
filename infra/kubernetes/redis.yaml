apiVersion: apps/v1
kind: Deployment
metadata: {name: nocmind-redis}
spec:
  replicas: 1
  selector: {matchLabels: {app: nocmind-redis}}
  template:
    metadata: {labels: {app: nocmind-redis}}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{containerPort: 6379}]
---
apiVersion: v1
kind: Service
metadata: {name: redis}
spec:
  selector: {app: nocmind-redis}
  ports: [{port: 6379, targetPort: 6379}]
