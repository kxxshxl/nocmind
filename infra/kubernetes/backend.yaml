apiVersion: apps/v1
kind: Deployment
metadata: {name: nocmind-backend}
spec:
  replicas: 1
  selector: {matchLabels: {app: nocmind-backend}}
  template:
    metadata: {labels: {app: nocmind-backend}}
    spec:
      containers:
        - name: backend
          image: nocmind/backend:latest
          ports: [{containerPort: 8000}]
          env:
            - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: nocmind-secrets, key: database-url}}}
            - {name: REDIS_URL, value: redis://redis:6379/0}
            - {name: APP_ENV, value: production}
            - {name: LLM_PROVIDER, value: ollama}
            - {name: OLLAMA_BASE_URL, value: "http://ollama:11434"}
            - {name: OLLAMA_MODEL, value: "qwen3:4b-instruct"}
            - {name: EVAL_JUDGE_PROVIDER, value: ollama}
            - {name: JWT_SECRET, valueFrom: {secretKeyRef: {name: nocmind-secrets, key: jwt-secret}}}
          readinessProbe: {httpGet: {path: /health/ready, port: 8000}, initialDelaySeconds: 30, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 90, periodSeconds: 20}
          command: ["sh", "-c"]
          args: ["PYTHONPATH=. alembic upgrade head && PYTHONPATH=. python scripts_seed.py && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
          resources: {requests: {cpu: 250m, memory: 1Gi}, limits: {cpu: 2000m, memory: 3Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: nocmind-backend}
spec:
  selector: {app: nocmind-backend}
  ports: [{port: 8000, targetPort: 8000}]
